<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Noto Sans TC',system-ui,sans-serif">
  <defs>
    <style>
      .t{font-weight:700;font-size:14px;fill:#0f172a}
      .s{font-size:11.5px;fill:#475569}
      .lab{font-size:11px;font-weight:700;fill:#334155}
      .cap{font-size:11.5px;fill:#64748b}
      .cut{stroke:#e11d48;stroke-width:2}
      .dim{stroke:#3b82f6;stroke-width:1}
      .mono{font-family:ui-monospace,monospace}
    </style>
  </defs>

  <text x="450" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">格狀鉸鏈：把一個大彎折，拆成幾十個小扭轉</text>

  <!-- ① 平板切縫（俯視） -->
  <rect x="40" y="60" width="230" height="150" rx="6" fill="#fef3c7" stroke="#d6b26a" stroke-width="1.5"/>
  <g class="cut">
    <line x1="110" y1="66" x2="110" y2="118"/><line x1="110" y1="140" x2="110" y2="204"/>
    <line x1="140" y1="82" x2="140" y2="162"/><line x1="140" y1="184" x2="140" y2="204"/>
    <line x1="170" y1="66" x2="170" y2="118"/><line x1="170" y1="140" x2="170" y2="204"/>
    <line x1="200" y1="82" x2="200" y2="162"/><line x1="200" y1="184" x2="200" y2="204"/>
  </g>
  <rect x="142" y="84" width="26" height="32" fill="#86efac" fill-opacity=".55" stroke="#16a34a" rx="2"/>
  <text x="155" y="235" text-anchor="middle" class="lab">① 平板雷射切出交錯縫</text>
  <text x="155" y="252" text-anchor="middle" class="cap">綠色＝一根扭轉連桿（斷面 w×t、長 l）</text>

  <!-- arrow -->
  <line x1="290" y1="135" x2="330" y2="135" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 324 128 L 336 135 L 324 142 Z" fill="#94a3b8"/>

  <!-- ② 扭轉特寫 -->
  <g transform="translate(355,70)">
    <rect x="0" y="45" width="180" height="24" rx="5" fill="#fde68a" stroke="#d6b26a"/>
    <path d="M 10 36 q 12 -14 26 -2" fill="none" stroke="#3b82f6" stroke-width="1.6"/>
    <path d="M 30 27 L 39 34 L 28 39 Z" fill="#3b82f6"/>
    <path d="M 170 78 q -12 14 -26 2" fill="none" stroke="#3b82f6" stroke-width="1.6"/>
    <path d="M 150 87 L 141 80 L 152 75 Z" fill="#3b82f6"/>
    <text x="90" y="20" text-anchor="middle" class="lab">② 每根連桿沿長軸「扭」而非「彎」</text>
    <text x="90" y="100" text-anchor="middle" class="s">變形分散在整根桿 → 應變小 → 不會斷</text>
    <text x="90" y="128" text-anchor="middle" class="cap mono" font-size="12" fill="#e11d48">n ≥ (β/α)·Θ·G·b / (τ_allow·l)</text>
    <text x="90" y="148" text-anchor="middle" class="cap">彎 Θ 度 ＝ n 排連桿各扭 Θ/n</text>
  </g>

  <!-- arrow -->
  <line x1="565" y1="135" x2="605" y2="135" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 599 128 L 611 135 L 599 142 Z" fill="#94a3b8"/>

  <!-- ③ 彎成弧（側視） -->
  <g transform="translate(625,55)">
    <path d="M 5 165 L 85 165 A 72 72 0 0 0 157 93 L 157 15" fill="none" stroke="#d6b26a" stroke-width="11" stroke-linecap="round"/>
    <path d="M 85 165 A 72 72 0 0 0 157 93" fill="none" stroke="#e11d48" stroke-width="2" stroke-dasharray="3 4"/>
    <line x1="85" y1="165" x2="157" y2="165" class="dim" stroke-dasharray="3 3"/>
    <line x1="157" y1="165" x2="157" y2="93" class="dim" stroke-dasharray="3 3"/>
    <line x1="157" y1="165" x2="106" y2="114" class="dim"/>
    <text x="122" y="146" class="cap mono" fill="#3b82f6" font-size="12">R</text>
    <text x="60" y="80" class="cap mono" fill="#e11d48" font-size="12">W = R·Θ</text>
    <text x="80" y="200" text-anchor="middle" class="lab">③ 彎折半徑可以「設計」出來</text>
    <text x="80" y="217" text-anchor="middle" class="cap">切之前就知道能彎幾度、圓多大</text>
  </g>

  <text x="450" y="290" text-anchor="middle" class="cap">參數 → 公式 → 切割圖 → 3D 模擬 → SVG/DXF · 線上工具：henrychao521.github.io/lattice-hinge-designer</text>
</svg>
