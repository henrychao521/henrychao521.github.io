<script src="/assets/js/shared.js"></script>
<script>
async function loadPost() {
  const slug = getQuery('slug');
  if (!slug) { document.getElementById('error-state').classList.remove('hidden'); return; }
  if (!/^[a-z0-9\-]+$/i.test(slug)) {
    document.getElementById('error-title').textContent = '無效的文章代碼';
    document.getElementById('error-state').classList.remove('hidden');
    return;
  }

  try {
    let url = `/posts/maker/${slug}.md`;
    let res = await fetch(url);
    if (!res.ok) { url = `/posts/blog/${slug}.md`; res = await fetch(url); }
    if (!res.ok) throw new Error('找不到此文章');

    const raw = await res.text();
    const { frontmatter, body } = parseFrontmatter(raw);

    document.getElementById('page-title').textContent = `${frontmatter.title} — 趙珩宇｜生活科技教室`;
    document.getElementById('article-title').textContent = frontmatter.title || '（無標題）';
    document.getElementById('article-date').textContent = frontmatter.date ? formatDate(frontmatter.date) : '';
    document.getElementById('article-author').textContent = frontmatter.author || '趙珩宇';
    document.getElementById('article-level').textContent = frontmatter.level || '';
    document.getElementById('article-hours').textContent = frontmatter.hours ? `課時 ${frontmatter.hours}` : '';

    if (frontmatter.categories) {
      document.getElementById('article-categories').innerHTML =
        frontmatter.categories.map(c => `<span>${String(c).replace(/[&<>"]/g, '')}</span>`).join('');
    }

    if (frontmatter.repo) {
      document.getElementById('repo-banner').classList.remove('hidden');
      document.getElementById('repo-name').textContent = frontmatter.repo;
      const repoLink = document.getElementById('repo-link');
      if (frontmatter.repo_private) {
        repoLink.replaceWith(Object.assign(document.createElement('span'), {
          id: 'repo-link', className: 'lock', title: '程式碼未公開，課程使用時提供', textContent: '程式碼於課程中提供',
        }));
      } else {
        repoLink.href = `https://github.com/henrychao521/${frontmatter.repo}`;
      }
    }

    document.getElementById('article-body').innerHTML = marked.parse(body);

    const isBlog = url.includes('/posts/blog/');
    const backLink = document.getElementById('back-link');
    if (backLink) {
      backLink.href = isBlog ? '/articles.html' : '/maker.html';
      backLink.textContent = isBlog ? '回教學文章' : '回 Maker 教案';
    }
    document.getElementById('edit-link').href =
      `https://github.com/henrychao521/henrychao521.github.io/edit/main${url}`;

    document.getElementById('article').classList.remove('hidden');
  } catch (e) {
    document.getElementById('error-message').textContent = e.message;
    document.getElementById('error-state').classList.remove('hidden');
  }
}

function parseFrontmatter(raw) {
  const match = raw.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!match) return { frontmatter: {}, body: raw };
  try { return { frontmatter: jsyaml.load(match[1]) || {}, body: match[2] }; }
  catch (e) { return { frontmatter: {}, body: raw }; }
}

document.addEventListener('DOMContentLoaded', loadPost);
</script>
